[project]
name = "transformer-memory-bench"
version = "0.1.0"
description = "Associative memory + KV-cache (classic vs sparse) experiments for transformers; rewrite of Transformer(1).ipynb"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers",
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tmem", "codemem"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_code"]
pythonpath = ["."]
addopts = "-m 'not integration and not gpu' -q"
markers = [
    "integration: needs HuggingFace checkpoints (network) but runs on CPU",
    "gpu: needs a CUDA/ROCm device; run explicitly with -m gpu after approval",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
